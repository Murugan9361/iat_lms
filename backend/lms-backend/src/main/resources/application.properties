spring.application.name=lms-backend

# ─── Database ───────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/lms_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ─── JWT ─────────────────────────────────────────────────────
app.jwt.secret=IATLMSSecretKey2024VeryLongSecretKeyForHmacSha256Algorithm!@#$
app.jwt.expiration-ms=86400000

# ─── File Upload ─────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=uploads/

# ─── Server ──────────────────────────────────────────────────
server.port=8080
server.servlet.context-path=/api

# ─── Logging ─────────────────────────────────────────────────
logging.level.com.iat=DEBUG
logging.level.org.springframework.security=DEBUG
